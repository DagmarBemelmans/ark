id = "ark-r"
name = "R (Ark)"
version = "0.0.2"
schema_version = 1
description = "R language support backed by the Ark kernel's language server."
repository = "https://github.com/posit-dev/ark"

# Tree-sitter grammar for R. Zed fetches and compiles this itself.
# Pinned to the same revision as ocsmit/zed-r v0.2.6 so that the query
# files copied from that project (see languages/r/*.scm) stay in sync
# with the grammar's node names.
[grammars.r]
repository = "https://github.com/r-lib/tree-sitter-r"
rev = "a0d3e3307489c3ca54da8c7b5b4e0c5f5fd6953a"

# Language server declaration. `language_server_command` (see src/lib.rs)
# launches this build's `ark` in LSP mode (`ark lsp`), resolving the binary
# from Zed's `lsp.ark.binary` setting or from `$PATH`.
[language_servers.ark]
name = "test"
languages = ["R"]

[language_servers.ark.language_ids]
"R" = "r"
